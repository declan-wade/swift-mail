name: Build and Release

# Builds the macOS app and attaches it to a GitHub Release.
#
# - Publishing a release (or pushing a `v*` tag, which auto-drafts one below)
#   triggers a build and uploads the .app, zipped, as a release asset.
# - `workflow_dispatch` lets you run the build on demand (e.g. to sanity-check
#   a branch); it uploads a build artifact instead of touching any release.
#
# This produces an UNSIGNED build (CODE_SIGNING_ALLOWED=NO) — CI has no access
# to your Developer ID certificate. Anyone downloading the zip will need to
# right-click → Open (or `xattr -cr`) past Gatekeeper the first time. To ship a
# signed, notarized build instead, add your certificate (base64 .p12) and an
# app-specific notarization password as repo secrets, import the cert in a
# step before `xcodebuild`, and run `xcodebuild -exportArchive` +
# `xcrun notarytool submit` — ask for that version if you want it wired up.

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

env:
  SCHEME: swift-mail
  PROJECT: swift-mail.xcodeproj

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # macOS gates its newer control metrics on the SDK a binary is LINKED
          # against, not on the OS it runs on — so an app built against the 26.5
          # SDK keeps 26-era toolbar sizing even on macOS 27, which is what made
          # the dropdown toolbar icons look wrong there. Xcode 27 ships on the
          # runner image as a *preview*, and `latest-stable` skips previews, so
          # it quietly resolved to Xcode 26 and shipped a 26.5-SDK build.
          #
          # Pinned to the major version: minor updates come along, a major one
          # is a deliberate choice. This is only the SDK we compile against —
          # MACOSX_DEPLOYMENT_TARGET stays 26.5, so macOS 26 is still supported.
          xcode-version: '27'

      - name: Verify SDK
        # The failure this guards against is invisible: linking against an older
        # SDK still builds and still runs, it just silently reverts the toolbar
        # rendering. Cheaper to fail here than to notice it in a release.
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "macOS SDK: $SDK"
          if [ "${SDK%%.*}" -lt 27 ]; then
            echo "::error::Expected macOS SDK 27 or newer, got $SDK — toolbar rendering will regress on macOS 27."
            exit 1
          fi

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Zip app bundle
        run: |
          set -euo pipefail
          cd build/Build/Products/Release
          # The bundle is named after PRODUCT_NAME (SwiftMail), not the scheme
          # (swift-mail), so it is discovered rather than spelled out — a future
          # rename can't break this step. Two matches make ditto fail loudly.
          APP=$(ls -d *.app)
          # ditto (not plain zip) preserves the bundle structure and extended
          # attributes an .app relies on.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/${APP%.app}-macos.zip"
          echo "ZIP=${APP%.app}-macos.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" \
            "$ZIP" \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Create release for tag push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            "$ZIP" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes
